name: Deploy PR Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  cleanup:
    name: Delete PR Environment
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          ENV_NAME="pr-${PR_NUMBER}"
          API_URL="https://backboard.railway.com/graphql/v2"

          # Find the PR environment
          ENV_ID=$(curl -s "$API_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }\"}" \
            | jq -r ".data.environments.edges[] | select(.node.name == \"$ENV_NAME\") | .node.id")

          if [ -n "$ENV_ID" ]; then
            echo "Deleting environment: $ENV_NAME ($ENV_ID)"
            curl -s "$API_URL" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"mutation { environmentDelete(id: \\\"$ENV_ID\\\") }\"}"
            echo "Environment deleted"
          else
            echo "No environment found for $ENV_NAME, skipping"
          fi

  build:
    name: Build & Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node -e "require('./index.js'); process.exit(0)"

  deploy:
    name: Deploy PR Environment
    if: github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    environment: pr-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Create PR environment and deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          ENV_NAME="pr-${PR_NUMBER}"
          API_URL="https://backboard.railway.com/graphql/v2"

          # Get source environment ID (development)
          echo "Fetching source environment..."
          SRC_ENV_ID=$(curl -s "$API_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }\"}" \
            | jq -r '.data.environments.edges[] | select(.node.name == "development") | .node.id')

          echo "Source environment ID: $SRC_ENV_ID"

          # Check if PR environment already exists
          EXISTING_ENV_ID=$(curl -s "$API_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { environments(projectId: \\\"$PROJECT_ID\\\") { edges { node { id name } } } }\"}" \
            | jq -r ".data.environments.edges[] | select(.node.name == \"$ENV_NAME\") | .node.id")

          if [ -n "$EXISTING_ENV_ID" ]; then
            echo "PR environment already exists: $EXISTING_ENV_ID"
            DEPLOY_ENV_ID="$EXISTING_ENV_ID"
          else
            # Create new environment
            echo "Creating PR environment: $ENV_NAME"
            DEPLOY_ENV_ID=$(curl -s "$API_URL" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"mutation { environmentCreate(input: { name: \\\"$ENV_NAME\\\", projectId: \\\"$PROJECT_ID\\\", sourceEnvironmentId: \\\"$SRC_ENV_ID\\\" }) { id } }\"}" \
              | jq -r '.data.environmentCreate.id')
            echo "Created environment: $DEPLOY_ENV_ID"
          fi

          # Generate environment-scoped deploy token
          echo "Generating deploy token..."
          DEPLOY_TOKEN=$(curl -s "$API_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { projectTokenCreate(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$DEPLOY_ENV_ID\\\", name: \\\"gh-deploy-pr-${PR_NUMBER}\\\" }) }\"}" \
            | jq -r '.data.projectTokenCreate')
          echo "Deploy token generated"

          # Deploy using the environment token
          npm install -g @railway/cli
          RAILWAY_TOKEN="$DEPLOY_TOKEN" railway up --service preview-railway
